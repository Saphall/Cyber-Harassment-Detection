<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cyber Harassment Detection</title>
	<style>
		:root {
			--bg: #0c111d;
			--panel: rgba(13, 25, 41, 0.78);
			--panel-strong: #132841;
			--text: #eaf2ff;
			--muted: #a8bdd8;
			--line: rgba(147, 184, 227, 0.28);
			--accent: #39b0ff;
			--accent-2: #00dfb3;
			--warn: #ffb020;
			--danger: #ff5f6d;
			--ok: #46d39a;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Avenir Next", "Segoe UI", sans-serif;
			color: var(--text);
			background:
				radial-gradient(1200px 700px at 0% -10%, rgba(57, 176, 255, 0.32), transparent 65%),
				radial-gradient(900px 600px at 90% 8%, rgba(0, 223, 179, 0.2), transparent 62%),
				linear-gradient(135deg, #070b12, var(--bg));
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 26px;
		}

		.shell {
			width: min(1120px, 100%);
			border: 1px solid var(--line);
			border-radius: 22px;
			overflow: hidden;
			background: var(--panel);
			backdrop-filter: blur(9px);
			box-shadow: 0 26px 70px rgba(0, 0, 0, 0.45);
		}

		.header {
			padding: 22px 24px;
			border-bottom: 1px solid var(--line);
			display: flex;
			justify-content: space-between;
			gap: 10px;
			align-items: center;
			background: linear-gradient(120deg, rgba(57, 176, 255, 0.1), rgba(0, 223, 179, 0.1));
		}

		h1 {
			margin: 0;
			letter-spacing: 0.35px;
			font-size: clamp(1.35rem, 2.6vw, 2rem);
			font-weight: 700;
		}

		.subtitle {
			margin-top: 5px;
			color: var(--muted);
			font-size: 0.94rem;
		}

		.badge {
			border: 1px solid var(--line);
			padding: 8px 12px;
			border-radius: 999px;
			font-size: 0.82rem;
			color: #d8f7ef;
			background: rgba(0, 223, 179, 0.14);
			white-space: nowrap;
		}

		.layout {
			display: grid;
			grid-template-columns: 0.95fr 1.05fr;
			gap: 0;
		}

		.left,
		.right {
			padding: 22px;
		}

		.right {
			border-left: 1px solid var(--line);
			background: linear-gradient(160deg, rgba(57, 176, 255, 0.05), rgba(8, 18, 33, 0.5));
		}

		label {
			display: block;
			margin-bottom: 9px;
			font-size: 0.9rem;
			color: var(--muted);
		}

		textarea {
			width: 100%;
			min-height: 210px;
			resize: vertical;
			border-radius: 14px;
			border: 1px solid rgba(147, 184, 227, 0.36);
			background: rgba(8, 17, 31, 0.78);
			color: var(--text);
			padding: 14px;
			font-size: 1rem;
			line-height: 1.45;
			outline: none;
			transition: border 0.2s ease, box-shadow 0.2s ease;
		}

		textarea:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 4px rgba(57, 176, 255, 0.16);
		}

		.controls {
			display: flex;
			gap: 10px;
			margin-top: 12px;
		}

		button {
			border: none;
			border-radius: 11px;
			padding: 11px 18px;
			font-weight: 700;
			font-size: 0.97rem;
			cursor: pointer;
			transition: transform 0.18s ease, box-shadow 0.2s ease, opacity 0.2s ease;
		}

		#predictBtn {
			background: linear-gradient(120deg, var(--accent), #4f7dff);
			color: #fff;
			box-shadow: 0 10px 22px rgba(57, 176, 255, 0.33);
		}

		#predictBtn:hover {
			transform: translateY(-1px);
		}

		#clearBtn {
			background: rgba(147, 184, 227, 0.14);
			color: var(--text);
			border: 1px solid var(--line);
		}

		button:disabled {
			opacity: 0.65;
			cursor: not-allowed;
			transform: none;
		}

		.status {
			margin-top: 14px;
			min-height: 21px;
			color: var(--muted);
			font-size: 0.92rem;
		}

		.result-title {
			margin: 0 0 12px;
			font-size: 1.02rem;
			color: #d4e7ff;
		}

		.chips {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			min-height: 35px;
			margin-bottom: 14px;
		}

		.chip {
			border-radius: 999px;
			padding: 7px 11px;
			font-size: 0.82rem;
			letter-spacing: 0.15px;
			border: 1px solid;
			animation: rise 0.28s ease;
		}

		.chip.flag {
			background: rgba(255, 95, 109, 0.18);
			border-color: rgba(255, 95, 109, 0.38);
			color: #ffd5da;
		}

		.chip.safe {
			background: rgba(70, 211, 154, 0.15);
			border-color: rgba(70, 211, 154, 0.35);
			color: #d5ffef;
		}

		.summary {
			margin-bottom: 12px;
			font-size: 0.92rem;
			color: var(--muted);
		}

		.chart-box {
			border: 1px solid var(--line);
			border-radius: 14px;
			padding: 10px;
			background: rgba(8, 18, 33, 0.62);
			min-height: 322px;
		}

		canvas {
			width: 100%;
			height: 305px;
		}

		.footer {
			font-size: 0.82rem;
			color: #89a1c0;
			margin-top: 10px;
		}

		@keyframes rise {
			from {
				transform: translateY(5px);
				opacity: 0;
			}
			to {
				transform: translateY(0);
				opacity: 1;
			}
		}

		@media (max-width: 860px) {
			.layout {
				grid-template-columns: 1fr;
			}

			.right {
				border-left: none;
				border-top: 1px solid var(--line);
			}

			textarea {
				min-height: 180px;
			}
		}
	</style>
</head>
<body>
	<main class="shell">
		<section class="header">
			<div>
				<h1>Cyber Harassment Detection</h1>
				<div class="subtitle">Analyze text and identify toxicity labels with confidence scores.</div>
			</div>
			<div class="badge">ML Prediction</div>
		</section>

		<section class="layout">
			<div class="left">
				<label for="inputText">Enter text to analyze</label>
				<textarea id="inputText" placeholder="Type a sentence or comment here..."></textarea>

				<div class="controls">
					<button id="predictBtn" type="button">Predict</button>
					<button id="clearBtn" type="button">Clear</button>
				</div>

				<div id="status" class="status">Waiting for input...</div>
			</div>

			<div class="right">
				<h2 class="result-title">Predicted Label(s)</h2>
				<div id="chipContainer" class="chips"></div>
				<div id="summary" class="summary">Run prediction to see category details.</div>

				<div class="chart-box">
					<canvas id="probabilityChart" width="680" height="340" aria-label="Harassment probability diagram"></canvas>
				</div>
				<div class="footer">Diagram shows class probabilities from 0 to 1.</div>
			</div>
		</section>
	</main>

	<script>
		const inputText = document.getElementById("inputText");
		const predictBtn = document.getElementById("predictBtn");
		const clearBtn = document.getElementById("clearBtn");
		const statusEl = document.getElementById("status");
		const chipContainer = document.getElementById("chipContainer");
		const summaryEl = document.getElementById("summary");
		const canvas = document.getElementById("probabilityChart");
		const ctx = canvas.getContext("2d");

		function titleCaseLabel(label) {
			return label
				.split("_")
				.map((part) => part.charAt(0).toUpperCase() + part.slice(1))
				.join(" ");
		}

		function setStatus(message, isError = false) {
			statusEl.textContent = message;
			statusEl.style.color = isError ? "#ff9ea8" : "#a8bdd8";
		}

		function resetResults() {
			chipContainer.innerHTML = "";
			summaryEl.textContent = "Run prediction to see category details.";
			drawChart({});
		}

		function renderChips(binaryPredictions, probabilities = {}) {
			chipContainer.innerHTML = "";
			const active = Object.entries(binaryPredictions)
				.filter((entry) => entry[1] === 1)
				.sort((a, b) => {
					const aScore = Number(probabilities[a[0]] || 0);
					const bScore = Number(probabilities[b[0]] || 0);
					return bScore - aScore;
				});

			if (active.length === 0) {
				const chip = document.createElement("span");
				chip.className = "chip safe";
				chip.textContent = "No Harassment Detected";
				chipContainer.appendChild(chip);
				return;
			}

			active.forEach(([label]) => {
				const chip = document.createElement("span");
				chip.className = "chip flag";
				chip.textContent = titleCaseLabel(label);
				chipContainer.appendChild(chip);
			});
		}

		function getSortedProbabilityEntries(probabilities) {
			return Object.entries(probabilities)
				.map(([label, score]) => [label, Number(score) || 0])
				.sort((a, b) => b[1] - a[1]);
		}

		function drawChart(probabilities) {
			const sortedEntries = getSortedProbabilityEntries(probabilities);
			const labels = sortedEntries.map(([label]) => label);
			const values = sortedEntries.map(([, score]) => score);

			const width = canvas.width;
			const height = canvas.height;

			ctx.clearRect(0, 0, width, height);
			ctx.fillStyle = "rgba(9, 19, 35, 0.9)";
			ctx.fillRect(0, 0, width, height);

			if (labels.length === 0) {
				ctx.fillStyle = "#9cb3d2";
				ctx.font = "15px Avenir Next";
				ctx.fillText("Prediction diagram will appear here.", 20, 36);
				return;
			}

			const leftPad = 125;
			const rightPad = 26;
			const topPad = 24;
			const bottomPad = 25;
			const innerHeight = height - topPad - bottomPad;
			const rowHeight = innerHeight / labels.length;
			const maxBarWidth = width - leftPad - rightPad;

			for (let i = 0; i <= 10; i++) {
				const x = leftPad + (maxBarWidth * i) / 10;
				ctx.strokeStyle = "rgba(147, 184, 227, 0.14)";
				ctx.beginPath();
				ctx.moveTo(x, topPad - 8);
				ctx.lineTo(x, height - bottomPad + 4);
				ctx.stroke();

				ctx.fillStyle = "rgba(168, 189, 216, 0.86)";
				ctx.font = "11px Avenir Next";
				ctx.fillText((i / 10).toFixed(1), x - 9, height - 8);
			}

			labels.forEach((label, index) => {
				const rawValue = Number(values[index]) || 0;
				const value = Math.max(0, Math.min(1, rawValue));
				const y = topPad + index * rowHeight;
				const barY = y + rowHeight * 0.2;
				const barHeight = rowHeight * 0.58;
				const barWidth = maxBarWidth * value;

				ctx.fillStyle = "rgba(147, 184, 227, 0.17)";
				ctx.fillRect(leftPad, barY, maxBarWidth, barHeight);

				const gradient = ctx.createLinearGradient(leftPad, barY, leftPad + barWidth, barY);
				gradient.addColorStop(0, "#39b0ff");
				gradient.addColorStop(1, value > 0.6 ? "#ff5f6d" : "#00dfb3");
				ctx.fillStyle = gradient;
				ctx.fillRect(leftPad, barY, barWidth, barHeight);

				ctx.fillStyle = "#d9eaff";
				ctx.font = "13px Avenir Next";
				ctx.fillText(titleCaseLabel(label), 10, barY + barHeight * 0.7);

				const valueText = value.toFixed(5);
				ctx.font = "12px Avenir Next";
				const textWidth = ctx.measureText(valueText).width;

				let textX = leftPad + barWidth + 7;
				let textAlign = "left";
				let textColor = "#f1fbff";

				if (textX + textWidth > width - 6) {
					textX = leftPad + Math.max(barWidth - 7, 0);
					textAlign = "right";
					textColor = "#ffffff";
				}

				ctx.textAlign = textAlign;
				ctx.fillStyle = textColor;
				ctx.fillText(valueText, textX, barY + barHeight * 0.68);
				ctx.textAlign = "left";
			});
		}

		async function predictText() {
			const comment = inputText.value.trim();
			if (!comment) {
				setStatus("Please enter text before prediction.", true);
				return;
			}

			predictBtn.disabled = true;
			setStatus("Predicting labels...");

			try {
				const response = await fetch("/predict", {
					method: "POST",
					headers: {
						"Content-Type": "application/json"
					},
					body: JSON.stringify({ comment_text: comment })
				});

				const data = await response.json();

				if (!response.ok) {
					throw new Error(data.error || "Prediction failed");
				}

				const binary = data.binary_predictions || {};
				const probabilities = data.probabilities || {};
				const sortedProbabilityEntries = getSortedProbabilityEntries(probabilities);
				const labelsDetected = sortedProbabilityEntries
					.map(([label]) => label)
					.filter((label) => binary[label] === 1);

				renderChips(binary, probabilities);
				drawChart(probabilities);

				if (labelsDetected.length === 0) {
					summaryEl.textContent = "Result: No harassment class crossed the threshold.";
				} else {
					summaryEl.textContent = "Result: " + labelsDetected.map(titleCaseLabel).join(", ");
				}

				setStatus("Prediction completed.");
			} catch (error) {
				setStatus(error.message || "Something went wrong during prediction.", true);
			} finally {
				predictBtn.disabled = false;
			}
		}

		predictBtn.addEventListener("click", predictText);
		clearBtn.addEventListener("click", () => {
			inputText.value = "";
			setStatus("Input cleared.");
			resetResults();
			inputText.focus();
		});

		drawChart({});
	</script>
</body>
</html>
